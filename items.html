<style>

    --surface: #ffffff;

    --ink-faint: #8b9080;

    --accent: #2f6e62;
    --accent-strong: #204e45;
    --accent-soft: #dceae5;
    --highlight: #c97a2e;
    --highlight-soft: #f3e2c9;
    --danger: #b6482f;
    --danger-soft: #f5e0d8;
    --shadow: 0 1px 2px rgba(34,38,31,0.06), 0 8px 24px -12px rgba(34,38,31,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121615;
      --surface: #1a201e;
      --surface-alt: #212824;
      --ink: #edeee6;
      --ink-soft: #aab0a0;
      --ink-faint: #737a6c;
      --line: #2b3330;
      --accent: #74bda8;
      --accent-strong: #a3d6c5;
      --accent-soft: #1e2f2b;
      --highlight: #e8a565;
      --highlight-soft: #382a1a;
      --danger: #e08668;

    --ink: #edeee6;
    --ink-soft: #aab0a0;
    --ink-faint: #737a6c;
    --line: #2b3330;
    --accent: #74bda8;
    --accent-strong: #a3d6c5;
    --accent-soft: #1e2f2b;
    --highlight: #e8a565;
    --highlight-soft: #382a1a;
    --danger: #e08668;

  body {

  .site-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 20px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
  }

  .nav-brand {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 6px;
  }

  .nav-link {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    text-decoration: none;
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid transparent;
  }

  .nav-link:hover {
    color: var(--ink);
    border-color: var(--line);
  }

  .nav-link.active {
    color: var(--accent-strong);
    background: var(--accent-soft);
    font-weight: 500;
  }

  /* ---------- header ---------- */

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }

  header.hero { margin-bottom: 32px; }

  header.hero h1 {
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 600;
    margin-top: 10px;
    letter-spacing: -0.01em;
  }

  header.hero p.sub {
    margin-top: 12px;
    max-width: 62ch;
    color: var(--ink-soft);
    font-size: 16px;
  }

  /* ---------- progress ---------- */

  .progress-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: center;
  }

  .progress-stat .num {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent-strong);
  }

  .progress-stat .label {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .progress-bar-wrap {
    flex: 1;
    min-width: 180px;
  }

  .progress-bar-track {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-alt);
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .progress-bar-caption {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 28px 0 20px;
  }

  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }

  .hide-toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .hide-toggle input { accent-color: var(--accent); }

  /* ---------- add form ---------- */

  .add-form {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }

  .add-form h2 {
    font-size: 15.5px;
    font-weight: 600;
  }

  .add-grid {
    display: grid;
    grid-template-columns: 2fr 1.2fr 0.7fr 1fr 0.9fr 1.6fr auto;
    gap: 10px;
    margin-top: 14px;
    align-items: end;
  }

  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-bottom: 5px;
    font-family: "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input, .field select {
    width: 100%;
    font-family: "Work Sans", sans-serif;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }

  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .add-btn {
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    white-space: nowrap;
  }

  .add-btn:hover { background: var(--accent-strong); }

  /* ---------- category groups ---------- */

  .cat-section { margin-bottom: 30px; }

  .cat-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .cat-title .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-faint);
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .item-row {
    display: grid;
    grid-template-columns: 26px 1.8fr 60px 90px 1fr 90px 30px;
    gap: 12px;
    align-items: center;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .item-row:last-child { border-bottom: none; }

  .item-row.done {
    background: var(--surface-alt);
  }

  .item-row.done .item-name { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); }

  .item-check {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 5px;
    cursor: pointer;
    position: relative;
    background: var(--surface);
  }

  .item-check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .item-check:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid var(--bg);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .item-name { font-weight: 500; }
  .item-note { display: block; color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; font-weight: 400; }

  .item-qty {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    text-align: center;
  }

  .priority-badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    text-align: center;
    white-space: nowrap;
  }

  .priority-필수 { background: var(--highlight-soft); color: var(--highlight); }
  .priority-선택 { background: var(--surface-alt); color: var(--ink-faint); }

  .item-cost {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .item-cost input {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    padding: 4px 6px;
    border-radius: 6px;
    text-align: right;
  }

  .item-cost input:hover, .item-cost input:focus {
    border-color: var(--line);
    background: var(--bg);
    outline: none;
  }

  .item-del {
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
    border-radius: 6px;
  }

  .item-del:hover { color: var(--danger); background: var(--danger-soft); }

  .empty-note {
    color: var(--ink-faint);
    font-size: 13.5px;
    padding: 16px;
    text-align: center;
  }

  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-faint);
  }

  @media (max-width: 760px) {
    .add-grid { grid-template-columns: 1fr 1fr; }
    .item-row {
      grid-template-columns: 22px 1fr auto;
      grid-template-areas:
        "check name del"
        "check meta meta";
    }
    .item-row .item-check { grid-area: check; }
    .item-row .item-name-wrap { grid-area: name; }
    .item-row .item-del { grid-area: del; }
    .item-row .item-qty, .item-row .priority-badge, .item-row .item-cost { grid-area: meta; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

    <form id="add-item-form">
      <div class="add-grid">
        <div class="field">
          <label for="f-name">이름</label>
          <input id="f-name" type="text" placeholder="예: 아기 손톱깎이" required>
        </div>
        <div class="field">
          <label for="f-category">카테고리</label>
          <select id="f-category">
            <option>장비</option>
            <option>아기 의류</option>
            <option>침구</option>
            <option>수유용품</option>
            <option>위생·케어</option>
            <option>장난감·발달</option>
            <option>병원가방·의류</option>

        <div class="field">

          <input id="f-cost" type="number" min="0" step="1000" placeholder="원">

        <div class="field">
          <label for="f-note">메모</label>
          <input id="f-note" type="text" placeholder="선택 입력">

        <button type="submit" class="add-btn">추가</button>

    </form>
  </div>

  <div class="controls" id="category-chips"></div>

  <div id="item-groups"></div>

  <footer>
    체크·추가·비용 입력은 이 브라우저의 로컬 저장소에만 저장되며 다른 기기와 공유되지 않습니다. 삭제한 항목은 되돌릴 수 없으니 주의해주세요.
  </footer>

</div>

    return {
      id: "seed-" + i,
      category: row[0],
      name: row[1],

      cost: row[4] === "" ? null : Number(row[4]),
      note: row[5],
      done: false
    };
  });

  var items = [];
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    items = Array.isArray(saved) ? saved : defaults;
  } catch (e) {
    items = defaults;
  }

  var activeFilter = "전체";
  var hideDone = false;

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  function fmtWon(n) {
    if (!n) return "-";
    return n.toLocaleString("ko-KR") + "원";
  }

  function renderStats() {
    var total = items.length;
    var done = items.filter(function (i) { return i.done; }).length;
    var totalCost = items.reduce(function (sum, i) { return sum + (i.cost || 0) * (i.qty || 1); }, 0);
    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-done").textContent = done;
    document.getElementById("stat-cost").textContent = totalCost.toLocaleString("ko-KR") + "원";
    var pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("progress-caption").textContent = done + " / " + total + " 완료 (" + pct + "%)";
  }

  function renderChips() {
    var wrap = document.getElementById("category-chips");
    wrap.innerHTML = "";
    var cats = ["전체"].concat(CATEGORIES);
    cats.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (cat === activeFilter ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", function () {
        activeFilter = cat;
        renderAll();
      });
      wrap.appendChild(btn);
    });
    var hideWrap = document.createElement("label");
    hideWrap.className = "hide-toggle";
    hideWrap.innerHTML = '<input type="checkbox" id="hide-done-toggle"> 완료 항목 숨기기';
    wrap.appendChild(hideWrap);
    document.getElementById("hide-done-toggle").checked = hideDone;
    document.getElementById("hide-done-toggle").addEventListener("change", function (e) {
      hideDone = e.target.checked;
      renderAll();
    });
  }

  function renderGroups() {
    var container = document.getElementById("item-groups");
    container.innerHTML = "";
    var cats = activeFilter === "전체" ? CATEGORIES : [activeFilter];

    cats.forEach(function (cat) {
      var catItems = items.filter(function (i) {
        return i.category === cat && (!hideDone || !i.done);
      });
      if (items.filter(function (i) { return i.category === cat; }).length === 0) return;

      var section = document.createElement("div");
      section.className = "cat-section";

      var doneInCat = items.filter(function (i) { return i.category === cat && i.done; }).length;
      var totalInCat = items.filter(function (i) { return i.category === cat; }).length;

      var titleHtml = document.createElement("div");
      titleHtml.className = "cat-title";
      titleHtml.innerHTML = cat + ' <span class="count">' + doneInCat + ' / ' + totalInCat + '</span>';
      section.appendChild(titleHtml);

      var card = document.createElement("div");
      card.className = "item-card";

      if (catItems.length === 0) {
        var empty = document.createElement("div");
        empty.className = "empty-note";
        empty.textContent = "표시할 항목이 없습니다.";
        card.appendChild(empty);
      }

      catItems.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "item-row" + (item.done ? " done" : "");

        var check = document.createElement("input");
        check.type = "checkbox";
        check.className = "item-check";
        check.checked = item.done;
        check.addEventListener("change", function () {
          item.done = check.checked;
          save();
          renderAll();
        });

        var nameWrap = document.createElement("div");
        nameWrap.className = "item-name-wrap";
        var nameEl = document.createElement("span");
        nameEl.className = "item-name";
        nameEl.textContent = item.name;
        nameWrap.appendChild(nameEl);
        if (item.note) {
          var noteEl = document.createElement("span");
          noteEl.className = "item-note";
          noteEl.textContent = item.note;
          nameWrap.appendChild(noteEl);
        }

        var qtyEl = document.createElement("div");
        qtyEl.className = "item-qty";
        qtyEl.textContent = "x" + item.qty;

        var badge = document.createElement("div");
        badge.className = "priority-badge priority-" + item.priority;
        badge.textContent = item.priority;

        var costWrap = document.createElement("div");
        costWrap.className = "item-cost";
        var costInput = document.createElement("input");
        costInput.type = "number";
        costInput.min = "0";
        costInput.step = "1000";
        costInput.placeholder = "원";
        costInput.value = item.cost === null || item.cost === undefined ? "" : item.cost;
        costInput.addEventListener("change", function () {
          var v = parseInt(costInput.value, 10);
          item.cost = isNaN(v) ? null : v;
          save();
          renderStats();
        });
        costWrap.appendChild(costInput);

        var del = document.createElement("button");
        del.type = "button";
        del.className = "item-del";
        del.setAttribute("aria-label", "삭제");
        del.textContent = "×";
        del.addEventListener("click", function () {
          items = items.filter(function (i) { return i.id !== item.id; });
          save();
          renderAll();
        });

        row.appendChild(check);
        row.appendChild(nameWrap);
        row.appendChild(qtyEl);
        row.appendChild(badge);
        row.appendChild(costWrap);
        row.appendChild(document.createElement("div"));
        row.appendChild(del);
        card.appendChild(row);
      });

      section.appendChild(card);
      container.appendChild(section);
    });
  }

  function renderAll() {
    renderStats();
    renderChips();
    renderGroups();
  }

  document.getElementById("add-item-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("f-name").value.trim();
    if (!name) return;
    var category = document.getElementById("f-category").value;
    var qty = parseInt(document.getElementById("f-qty").value, 10) || 1;
    var priority = document.getElementById("f-priority").value;
    var costRaw = document.getElementById("f-cost").value;
    var cost = costRaw === "" ? null : parseInt(costRaw, 10);
    var note = document.getElementById("f-note").value.trim();

    items.push({
      id: "item-" + Date.now(),
      category: category,
      name: name,
      qty: qty,
      priority: priority,
      cost: cost,
      note: note,
      done: false
    });
    save();
    e.target.reset();
    document.getElementById("f-qty").value = 1;
    activeFilter = category;
    renderAll();
  });

  renderAll();
})();
